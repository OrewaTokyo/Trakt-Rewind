name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests before publishing
        run: python -m unittest discover -s tests -v

      - name: Create release archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -j "Trakt-Rewind-${TAG}.zip" trakt_rewind.py trakt_config.example.json README.md LICENSE SECURITY.md CHANGELOG.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            trakt_rewind.py
            Trakt-Rewind-${{ github.ref_name }}.zip
