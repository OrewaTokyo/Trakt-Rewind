name: Bug Report
description: Report a bug, crash, or unexpected Trakt API behavior in Trakt-Rewind.
title: "[Bug]: "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! **Never paste your `trakt_token.json`, OAuth access tokens, or refresh tokens below.**

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clearly describe the bug and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `python trakt_rewind.py`
        2. Search for '...'
        3. Select option '...'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10
        - Linux
        - macOS
        - Android (Termux)
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: "e.g., Python 3.11.8"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Error Traceback
      description: Copy and paste the relevant error output (remove any personal tokens first).
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I confirmed that no personal OAuth tokens or secrets are included in this report.
          required: true
